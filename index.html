<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Both teams to score</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ground: #0b110f;
  --panel: #0f1714;
  --panel-hi: #141e1a;
  --line: #1e2a25;
  --line-hi: #2c3a34;
  --ink: #f2f4f2;
  --ink-soft: #c8d0cc;
  --muted: #7d8a84;
  --dim: #4d5c56;
  --lit: #eda100;
  --balanced: #1baf7a;
  --lopsided: #eb6834;
  --r: 8px;
  --bar-max: 3;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

body { padding: 0 20px 80px; }
.wrap { max-width: 1080px; margin: 0 auto; }
:focus-visible { outline: 2px solid var(--lit); outline-offset: 2px; }

.masthead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  padding: 30px 0 18px;
}

.masthead h1 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
.masthead p { margin: 3px 0 0; color: var(--muted); font-size: 13px; max-width: 56ch; }
.status { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }

button { font: inherit; color: inherit; cursor: pointer; }

.btn {
  background: var(--panel);
  border: 1px solid var(--line-hi);
  border-radius: var(--r);
  padding: 6px 12px;
  font-size: 13px;
  color: var(--ink-soft);
}
.btn:hover { border-color: var(--dim); color: var(--ink); }
.btn[disabled] { opacity: 0.45; cursor: default; }

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  padding: 16px;
  background: var(--panel);
  border-radius: var(--r);
}

.control { display: flex; flex-direction: column; gap: 6px; }
.control > span { font-size: 11px; color: var(--muted); }

.segmented { display: flex; background: var(--ground); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.segmented button {
  background: none;
  border: 0;
  border-right: 1px solid var(--line);
  padding: 5px 10px;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.segmented button:last-child { border-right: 0; }
.segmented button:hover { color: var(--ink-soft); }
.segmented button[aria-pressed="true"] { background: var(--panel-hi); color: var(--ink); }

.strip { display: flex; flex-wrap: wrap; gap: 30px; padding: 20px 4px; }
.stat > b { display: block; font-size: 23px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat > span { font-size: 11px; color: var(--muted); }

.board { background: var(--panel); border-radius: var(--r); padding: 4px 16px 10px; }
.boardhead {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 12px 0 4px;
  font-size: 12px;
  color: var(--muted);
}

.fixture {
  display: grid;
  grid-template-columns: 78px minmax(0, 1fr) 190px;
  gap: 16px;
  align-items: center;
  padding: 11px 0;
  border-top: 1px solid var(--line);
}

.fixture:hover { background: var(--panel-hi); }

.pcell > b { display: block; font-size: 25px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
.pcell > span { font-size: 11px; color: var(--muted); }

.names { font-size: 14px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.names em { font-style: normal; color: var(--dim); padding: 0 3px; }

.forms { display: flex; justify-content: space-between; margin-top: 6px; gap: 12px; }
.form { display: flex; gap: 3px; }
.form i { display: block; width: 14px; height: 3px; border-radius: 1px; background: var(--line-hi); }
.form i.on { background: var(--lit); }

.bars { display: flex; align-items: center; height: 20px; }
.bars .side { flex: 1; display: flex; }
.bars .side.l { justify-content: flex-end; }
.bars .axis { width: 1px; height: 18px; background: var(--dim); flex: 0 0 auto; }
.bars span.b { height: 9px; display: block; }
.bars .l span.b { border-radius: 2px 0 0 2px; }
.bars .r span.b { border-radius: 0 2px 2px 0; }

.lambdas { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.meta { text-align: right; font-size: 11px; color: var(--muted); margin-top: 3px; }

.flag { color: var(--lit); font-size: 10px; padding-left: 5px; }

table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: var(--r); font-variant-numeric: tabular-nums; margin-top: 8px; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); font-size: 13px; }
th { position: sticky; top: 0; background: var(--panel-hi); font-weight: 500; font-size: 11px; color: var(--muted); cursor: pointer; }
th:first-child, td:first-child { text-align: left; }
td { color: var(--ink-soft); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { color: var(--ink); }

.note { background: var(--panel); border-left: 3px solid var(--lit); border-radius: 0 var(--r) var(--r) 0; padding: 14px 16px; margin-top: 18px; font-size: 14px; }
.note h3 { margin: 0 0 6px; font-size: 14px; font-weight: 500; }
.note p { margin: 0 0 8px; color: var(--ink-soft); }
.note p:last-child { margin-bottom: 0; }
.note code { font-size: 12px; background: var(--ground); padding: 1px 5px; border-radius: 3px; }

.empty { padding: 50px 0; text-align: center; color: var(--muted); }
.hidden { display: none !important; }

@media (max-width: 820px) {
  .fixture { grid-template-columns: 66px minmax(0, 1fr); row-gap: 10px; }
  .barcell { grid-column: 1 / -1; }
  .pcell > b { font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div>
      <h1>Both teams to score</h1>
      <p>Poisson attack and defence ratings across the Premier League, Championship, League One and League Two.</p>
    </div>
    <div class="status">
      <span id="dataStatus">Loading…</span>
      <button class="btn" id="refreshBtn">Refresh data</button>
    </div>
  </header>

  <section class="controls">
    <label class="control"><span>Divisions</span><div class="segmented" id="divControl"></div></label>
    <label class="control"><span>Matches used</span>
      <div class="segmented" id="windowControl">
        <button type="button" data-window="season">This season</button>
        <button type="button" data-window="180">6 months</button>
        <button type="button" data-window="365">12 months</button>
        <button type="button" data-window="all">All loaded</button>
      </div>
    </label>
    <label class="control"><span>Recency weighting</span>
      <div class="segmented" id="decayControl">
        <button type="button" data-decay="0">Off</button>
        <button type="button" data-decay="60">Fast</button>
        <button type="button" data-decay="150">Medium</button>
        <button type="button" data-decay="365">Slow</button>
      </div>
    </label>
    <label class="control"><span>Sort by</span>
      <div class="segmented" id="sortControl">
        <button type="button" data-sort="model">Model</button>
        <button type="button" data-sort="balance">Balance</button>
        <button type="button" data-sort="blend">Past BTTS</button>
        <button type="button" data-sort="date">Kick-off</button>
      </div>
    </label>
    <label class="control"><span>View</span>
      <div class="segmented" id="viewControl">
        <button type="button" data-view="fixtures">Fixtures</button>
        <button type="button" data-view="teams">Ratings</button>
        <button type="button" data-view="results">Results</button>
      </div>
    </label>
  </section>

  <section class="strip" id="strip"></section>

  <div id="messages"></div>
  <div id="fixturesView"></div>
  <div id="teamsView" class="hidden"></div>
  <div id="resultsView" class="hidden"></div>

</div>

<script>
'use strict';

const DIV_ORDER = ['E0', 'E1', 'E2', 'E3'];
const DIV_SHORT = { E0: 'Premier', E1: 'Champ', E2: 'League One', E3: 'League Two' };
const CACHE_KEY = 'btts.data.v1';
const PREFS_KEY = 'btts.prefs.v3';
const CACHE_MAX_AGE = 3 * 60 * 60 * 1000;
const FORM_MARKS = 6;
const BAR_MAX = 3;

let data = null;
let teamIndex = null;
let ratingsCache = { key: null, value: null };

const prefs = Object.assign({
  divisions: ['E0', 'E1', 'E2', 'E3'],
  window: 'all',
  decay: '150',
  sort: 'model',
  view: 'fixtures',
  minMatches: 6,
}, loadPrefs());

function loadPrefs() {
  try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch { return {}; }
}
function savePrefs() {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {}
}

// ---------------------------------------------------------------------------
// Loading
// ---------------------------------------------------------------------------

// The Netlify function is the live path. The committed data file is kept as
// a fallback so the tool still works on GitHub Pages if it's ever moved.
const DATA_SOURCES = ['/.netlify/functions/data', './data/data.json'];

async function fetchPayload(force) {
  const failures = [];

  for (const url of DATA_SOURCES) {
    try {
      // A manual refresh has to change the URL, or Netlify's CDN just hands
      // back the same cached response it's been holding.
      const target = force && url.indexOf('/.netlify/') === 0
        ? url + '?t=' + Date.now()
        : url;

      const res = await fetch(target, { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const payload = await res.json();

      if (!payload.matches || !payload.matches.length) {
        const detail = (payload.errors || []).slice(0, 2)
          .map((e) => e.url.split('/').slice(-2).join('/') + ' — ' + e.message)
          .join('; ');
        throw new Error(detail || 'no matches in payload');
      }

      return payload;
    } catch (err) {
      failures.push(url.replace('./', '') + ' — ' + err.message);
    }
  }

  throw new Error(failures.join('; '));
}

async function load({ force = false } = {}) {
  const cached = readCache();

  if (cached && !force) {
    adopt(cached, true);
    if (cacheAge(cached) < CACHE_MAX_AGE) return;
  }

  setStatus(cached ? 'Checking for new fixtures…' : 'Fetching results…');

  try {
    const payload = await fetchPayload(force);
    writeCache(payload);
    adopt(payload, false);
  } catch (err) {
    if (cached) {
      if (force) adopt(cached, true);
      showFetchNote(err.message, true);
    } else {
      setStatus('No data');
      showFetchNote(err.message, false);
    }
  }
}

function cacheAge(payload) {
  const t = new Date(payload.fetchedAt).getTime();
  return Number.isFinite(t) ? Date.now() - t : Infinity;
}
function readCache() {
  try { const raw = localStorage.getItem(CACHE_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
}
function writeCache(payload) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(payload)); } catch {}
}

function adopt(payload, fromCache) {
  data = payload;
  ratingsCache = { key: null, value: null };
  buildTeamIndex();
  const when = new Date(payload.fetchedAt);
  const label = when.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  setStatus(payload.matches.length + ' matches · ' + (fromCache ? 'cached ' : '') + label);
  render();
}

function setStatus(text) { document.getElementById('dataStatus').textContent = text; }

function showFetchNote(message, haveCache) {
  const el = document.createElement('div');
  el.className = 'note';
  el.innerHTML = haveCache
    ? '<h3>Showing the last saved copy</h3><p>The live fetch failed: ' + escapeHtml(message) + '.</p>'
    : '<h3>Could not reach the data function</h3><p>Nothing answered: ' + escapeHtml(message) + '.</p>'
      + '<p>If you are opening this file directly, the function is not running. Start it with <code>netlify dev</code>, or deploy the site.</p>';
  document.getElementById('messages').appendChild(el);
}

// ---------------------------------------------------------------------------
// Team index
// ---------------------------------------------------------------------------

function buildTeamIndex() {
  teamIndex = new Map();

  const touch = (name) => {
    if (!teamIndex.has(name)) teamIndex.set(name, { name, matches: [], divisions: new Set() });
    return teamIndex.get(name);
  };

  for (const m of data.matches) {
    const home = touch(m.home);
    const away = touch(m.away);
    home.divisions.add(m.div);
    away.divisions.add(m.div);
    home.matches.push({ date: m.date, div: m.div, venue: 'H', gf: m.hg, ga: m.ag });
    away.matches.push({ date: m.date, div: m.div, venue: 'A', gf: m.ag, ga: m.hg });
  }

  for (const team of teamIndex.values()) {
    team.matches.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    team.div = team.matches.length ? team.matches[0].div : null;
    team.moved = team.divisions.size > 1;
  }
}

// ---------------------------------------------------------------------------
// Match window
// ---------------------------------------------------------------------------

function windowCutoff() {
  if (prefs.window === 'all') return null;
  if (prefs.window === 'season') {
    const label = data.seasons && data.seasons[0];
    const year = label ? Number(String(label).slice(0, 4)) : null;
    return Number.isFinite(year) ? year + '-07-01' : null;
  }
  const d = new Date();
  d.setDate(d.getDate() - Number(prefs.window));
  return d.toISOString().slice(0, 10);
}

function matchesInWindow() {
  const cutoff = windowCutoff();
  return cutoff ? data.matches.filter((m) => m.date >= cutoff) : data.matches;
}

// ---------------------------------------------------------------------------
// Ratings — Poisson attack/defence by iterative proportional fitting
//
//   home goals ~ Poisson(mu * attack(home) * defence(away) * homeEdge)
//   away goals ~ Poisson(mu * attack(away) * defence(home))
//
// Attack above 1 means a side scores more than its division average; defence
// above 1 means it lets in more. Both normalise to a division mean of 1.
//
// Divisions are fitted separately — no matches run between them, so their
// ratings are not on a common scale and cannot be made so from results alone.
// ---------------------------------------------------------------------------

const HOME_EDGE_INIT = 1.3;
const ITERATIONS = 60;
const SHRINK_K = 4;

function decayWeight(dateStr, halfLifeDays, today) {
  if (!halfLifeDays) return 1;
  const age = (today - new Date(dateStr + 'T12:00:00')) / 86400000;
  return Math.pow(0.5, Math.max(0, age) / halfLifeDays);
}

function fitDivision(matches, halfLife) {
  const today = new Date();
  const rows = matches.map((m) => ({
    home: m.home, away: m.away, hg: m.hg, ag: m.ag,
    w: decayWeight(m.date, halfLife, today),
  }));

  let wSum = 0, goalSum = 0;
  for (const m of rows) { wSum += m.w; goalSum += m.w * (m.hg + m.ag); }
  if (!wSum) return null;

  const mu = goalSum / (2 * wSum);

  const names = new Set();
  for (const m of rows) { names.add(m.home); names.add(m.away); }

  const attack = new Map(), defence = new Map(), weight = new Map(), played = new Map();
  for (const n of names) { attack.set(n, 1); defence.set(n, 1); weight.set(n, 0); played.set(n, 0); }
  for (const m of rows) {
    weight.set(m.home, weight.get(m.home) + m.w);
    weight.set(m.away, weight.get(m.away) + m.w);
    played.set(m.home, played.get(m.home) + 1);
    played.set(m.away, played.get(m.away) + 1);
  }

  let homeEdge = HOME_EDGE_INIT;

  for (let it = 0; it < ITERATIONS; it++) {
    const aNum = new Map(), aDen = new Map(), bNum = new Map(), bDen = new Map();
    for (const n of names) { aNum.set(n, 0); aDen.set(n, 0); bNum.set(n, 0); bDen.set(n, 0); }

    for (const m of rows) {
      const h = m.home, a = m.away, w = m.w;
      aNum.set(h, aNum.get(h) + w * m.hg);
      aDen.set(h, aDen.get(h) + w * mu * defence.get(a) * homeEdge);
      aNum.set(a, aNum.get(a) + w * m.ag);
      aDen.set(a, aDen.get(a) + w * mu * defence.get(h));
      bNum.set(h, bNum.get(h) + w * m.ag);
      bDen.set(h, bDen.get(h) + w * mu * attack.get(a));
      bNum.set(a, bNum.get(a) + w * m.hg);
      bDen.set(a, bDen.get(a) + w * mu * attack.get(h) * homeEdge);
    }

    for (const n of names) {
      if (aDen.get(n) > 0) attack.set(n, aNum.get(n) / aDen.get(n));
      if (bDen.get(n) > 0) defence.set(n, bNum.get(n) / bDen.get(n));
    }

    let mean = 0;
    for (const n of names) mean += attack.get(n);
    mean /= names.size;
    if (mean > 0) {
      for (const n of names) {
        attack.set(n, attack.get(n) / mean);
        defence.set(n, defence.get(n) * mean);
      }
    }

    let hNum = 0, hDen = 0;
    for (const m of rows) {
      hNum += m.w * m.hg;
      hDen += m.w * mu * attack.get(m.home) * defence.get(m.away);
    }
    if (hDen > 0) homeEdge = hNum / hDen;
  }

  const teams = new Map();
  for (const n of names) {
    const w = weight.get(n);
    const f = w / (w + SHRINK_K);
    teams.set(n, {
      attack: Math.exp(Math.log(attack.get(n)) * f),
      defence: Math.exp(Math.log(defence.get(n)) * f),
      played: played.get(n),
    });
  }

  return { mu, homeEdge, teams };
}

function ratings() {
  const key = prefs.window + '|' + prefs.decay;
  if (ratingsCache.key === key) return ratingsCache.value;

  const halfLife = Number(prefs.decay) || 0;
  const pool = matchesInWindow();
  const byDiv = {};
  for (const div of DIV_ORDER) {
    const ms = pool.filter((m) => m.div === div);
    byDiv[div] = ms.length ? fitDivision(ms, halfLife) : null;
  }

  ratingsCache = { key, value: byDiv };
  return byDiv;
}

// ---------------------------------------------------------------------------
// Probabilities
// ---------------------------------------------------------------------------

function pBtts(lh, la) { return (1 - Math.exp(-lh)) * (1 - Math.exp(-la)); }

function pOver(lh, la, line) {
  const L = lh + la;
  let cdf = 0, term = Math.exp(-L);
  for (let k = 0; k <= line; k++) { cdf += term; term *= L / (k + 1); }
  return 1 - cdf;
}

function marketOver25(fx) {
  if (!fx.over25 || !fx.under25) return null;
  const o = 1 / fx.over25, u = 1 / fx.under25;
  return o + u > 0 ? o / (o + u) : null;
}

// ---------------------------------------------------------------------------
// Baselines
// ---------------------------------------------------------------------------

function venueRates(team, venue) {
  const cutoff = windowCutoff();
  let pool = team.matches.filter((m) => m.venue === venue);
  if (cutoff) pool = pool.filter((m) => m.date >= cutoff);

  const n = pool.length;
  if (!n) return { n: 0, btts: null };

  let btts = 0;
  for (const m of pool) if (m.gf > 0 && m.ga > 0) btts++;
  return { n, btts: btts / n };
}

// ---------------------------------------------------------------------------
// Fixture scoring
// ---------------------------------------------------------------------------

function scoreFixture(fx) {
  const home = teamIndex.get(fx.home);
  const away = teamIndex.get(fx.away);
  if (!home || !away) {
    return { fx, unmatched: [!home && fx.home, !away && fx.away].filter(Boolean) };
  }

  const homeForm = venueRates(home, 'H');
  const awayForm = venueRates(away, 'A');
  const blend = homeForm.btts !== null && awayForm.btts !== null
    ? (homeForm.btts + awayForm.btts) / 2 : null;

  const fit = ratings()[fx.div];
  let model = null, lh = null, la = null, modelOver = null, balance = null;

  if (fit) {
    const h = fit.teams.get(fx.home);
    const a = fit.teams.get(fx.away);
    const ha = h ? h.attack : 1, hd = h ? h.defence : 1;
    const aa = a ? a.attack : 1, ad = a ? a.defence : 1;

    lh = fit.mu * ha * ad * fit.homeEdge;
    la = fit.mu * aa * hd;
    model = pBtts(lh, la);
    modelOver = pOver(lh, la, 2);
    // How two-way the fixture is. 1 means both sides are expected to score
    // equally; near 0 means one side is expected to do all the scoring.
    balance = Math.min(lh, la) / Math.max(lh, la);
  }

  const market = marketOver25(fx);

  return {
    fx, home, away, blend, model, lh, la, modelOver, market, balance,
    thin: homeForm.n < prefs.minMatches || awayForm.n < prefs.minMatches,
    calib: model !== null && market !== null ? modelOver - market : null,
  };
}

function upcomingFixtures() {
  const today = new Date().toISOString().slice(0, 10);
  return data.fixtures
    .filter((f) => prefs.divisions.includes(f.div))
    .filter((f) => f.date >= today);
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function render() {
  syncControls();
  if (!data) return;

  const rows = upcomingFixtures().map(scoreFixture);
  renderStrip(rows);

  const fixturesEl = document.getElementById('fixturesView');
  const teamsEl = document.getElementById('teamsView');
  const resultsEl = document.getElementById('resultsView');

  fixturesEl.classList.toggle('hidden', prefs.view !== 'fixtures');
  teamsEl.classList.toggle('hidden', prefs.view !== 'teams');
  resultsEl.classList.toggle('hidden', prefs.view !== 'results');

  if (prefs.view === 'fixtures') renderFixtures(rows);
  else if (prefs.view === 'teams') renderTeams();
  else renderResults();
}

function renderStrip(rows) {
  const fits = ratings();
  const priced = rows.filter((r) => r.model != null);
  const avgModel = priced.length ? priced.reduce((a, r) => a + r.model, 0) / priced.length : null;

  const calibs = rows.map((r) => r.calib).filter((c) => c != null);
  const bias = calibs.length ? calibs.reduce((a, c) => a + c, 0) / calibs.length : null;

  const edges = DIV_ORDER.filter((d) => prefs.divisions.includes(d) && fits[d]).map((d) => fits[d].homeEdge);
  const avgEdge = edges.length ? edges.reduce((a, e) => a + e, 0) / edges.length : null;

  const rated = DIV_ORDER
    .filter((d) => prefs.divisions.includes(d) && fits[d])
    .reduce((a, d) => a + fits[d].teams.size, 0);

  document.getElementById('strip').innerHTML =
    stat(rows.length, 'fixtures ahead') +
    stat(avgModel == null ? '—' : pct(avgModel), 'average model chance') +
    stat(avgEdge == null ? '—' : '×' + avgEdge.toFixed(2), 'home scoring edge') +
    stat(bias == null ? '—' : (bias >= 0 ? '+' : '') + (bias * 100).toFixed(1) + 'pt', 'model vs market on over 2.5') +
    stat(rated, 'teams rated');
}

function stat(value, label) {
  return '<div class="stat"><b>' + value + '</b><span>' + label + '</span></div>';
}

function renderFixtures(rows) {
  const view = document.getElementById('fixturesView');

  if (!rows.length) {
    view.innerHTML = '<div class="empty">No upcoming fixtures in the selected divisions. The source file fills up as the weekend approaches.</div>';
    return;
  }

  const sorted = rows.slice().sort(compareRows);
  let html = '';

  if (prefs.sort === 'date') {
    const byDay = new Map();
    for (const r of sorted) {
      if (!byDay.has(r.fx.date)) byDay.set(r.fx.date, []);
      byDay.get(r.fx.date).push(r);
    }
    for (const [date, group] of byDay) {
      html += board(longDate(date), group);
    }
  } else {
    const heading = {
      model: 'Ranked by the model',
      balance: 'Ranked by how two-way the fixture is',
      blend: 'Ranked by how often both teams have scored',
    }[prefs.sort];
    html = board(heading, sorted);
  }

  view.innerHTML = html;
}

function board(title, group) {
  return '<section class="board"><div class="boardhead"><span>' + escapeHtml(title)
    + '</span><span>expected goals</span></div>' + group.map(fixtureRow).join('') + '</section>';
}

function compareRows(a, b) {
  if (prefs.sort === 'date') {
    if (a.fx.date !== b.fx.date) return a.fx.date < b.fx.date ? -1 : 1;
    return (a.fx.time || '').localeCompare(b.fx.time || '');
  }
  const key = prefs.sort === 'blend' ? 'blend' : prefs.sort === 'balance' ? 'balance' : 'model';
  const av = a[key] == null ? -1 : a[key];
  const bv = b[key] == null ? -1 : b[key];
  return bv - av;
}

// Lit marks are matches the team scored in, newest on the right.
function formMarks(team) {
  const recent = team.matches.slice(0, FORM_MARKS).reverse();
  return '<div class="form">' + recent.map((m) =>
    '<i class="' + (m.gf > 0 ? 'on' : '') + '"></i>').join('') + '</div>';
}

// Bars read outward from a centre line, so a balanced fixture is symmetrical
// and a mismatch is visibly lopsided.
function goalBars(r) {
  if (r.lh == null) return '<div class="bars"></div>';

  const colour = r.balance > 0.62 ? 'var(--balanced)' : 'var(--lopsided)';
  const wl = Math.min(100, (r.lh / BAR_MAX) * 100);
  const wr = Math.min(100, (r.la / BAR_MAX) * 100);

  return '<div class="bars">'
    + '<div class="side l"><span class="b" style="width:' + wl.toFixed(1) + '%;background:' + colour + '"></span></div>'
    + '<span class="axis"></span>'
    + '<div class="side r"><span class="b" style="width:' + wr.toFixed(1) + '%;background:' + colour + '"></span></div>'
    + '</div>'
    + '<div class="lambdas"><span>' + r.lh.toFixed(2) + '</span><span>' + r.la.toFixed(2) + '</span></div>';
}

function fixtureRow(r) {
  const fx = r.fx;

  if (r.unmatched) {
    return '<article class="fixture"><div class="pcell"><b>—</b><span>no data</span></div>'
      + '<div><div class="names">' + escapeHtml(fx.home) + ' <em>v</em> ' + escapeHtml(fx.away) + '</div></div>'
      + '<div class="barcell"><div class="meta">' + escapeHtml(r.unmatched.join(', ')) + ' not in results</div></div></article>';
  }

  const headline = prefs.sort === 'blend' ? r.blend : prefs.sort === 'balance' ? r.balance : r.model;
  const headlineLabel = prefs.sort === 'blend' ? 'past BTTS'
    : prefs.sort === 'balance' ? 'balance' : 'both score';

  const meta = shortDate(fx.date) + (fx.time ? ' ' + fx.time : '') + ' · ' + (DIV_SHORT[fx.div] || fx.div)
    + (r.market != null ? ' · o2.5 ' + pct(r.modelOver) + '/' + pct(r.market) : '')
    + (r.thin ? ' · thin' : '');

  return '<article class="fixture">'
    + '<div class="pcell"><b>' + pct(headline) + '</b><span>' + headlineLabel + '</span></div>'
    + '<div><div class="names">' + escapeHtml(fx.home) + (r.home.moved ? '<span class="flag">moved</span>' : '')
      + ' <em>v</em> ' + escapeHtml(fx.away) + (r.away.moved ? '<span class="flag">moved</span>' : '') + '</div>'
      + '<div class="forms">' + formMarks(r.home) + formMarks(r.away) + '</div></div>'
    + '<div class="barcell">' + goalBars(r) + '<div class="meta">' + escapeHtml(meta) + '</div></div>'
    + '</article>';
}

let teamSort = { key: 'goals', dir: -1 };

function renderTeams() {
  const fits = ratings();
  const rows = [];

  for (const div of DIV_ORDER) {
    if (!prefs.divisions.includes(div) || !fits[div]) continue;
    const fit = fits[div];
    for (const [name, t] of fit.teams) {
      const indexed = teamIndex.get(name);
      rows.push({
        name, div,
        played: t.played,
        attack: t.attack,
        defence: t.defence,
        scoresHome: fit.mu * t.attack * fit.homeEdge,
        scoresAway: fit.mu * t.attack,
        concedes: fit.mu * t.defence,
        goals: fit.mu * (t.attack + t.defence),
        moved: indexed ? indexed.moved : false,
      });
    }
  }

  rows.sort((a, b) => {
    const av = a[teamSort.key], bv = b[teamSort.key];
    if (typeof av === 'string') return av.localeCompare(bv) * teamSort.dir * -1;
    return (av - bv) * teamSort.dir;
  });

  const cols = [
    ['name', 'Team'], ['div', 'Division'], ['played', 'Games'],
    ['attack', 'Attack'], ['defence', 'Defence'],
    ['scoresHome', 'Scores at home'], ['scoresAway', 'Scores away'],
    ['concedes', 'Lets in'], ['goals', 'Goals in its games'],
  ];

  document.getElementById('teamsView').innerHTML =
    '<table><thead><tr>' + cols.map((c) => '<th data-key="' + c[0] + '">' + c[1] + '</th>').join('')
    + '</tr></thead><tbody>'
    + rows.map((r) => '<tr>'
      + '<td>' + escapeHtml(r.name) + (r.moved ? '<span class="flag">moved</span>' : '') + '</td>'
      + '<td>' + DIV_SHORT[r.div] + '</td><td>' + r.played + '</td>'
      + '<td>' + r.attack.toFixed(2) + '</td><td>' + r.defence.toFixed(2) + '</td>'
      + '<td>' + r.scoresHome.toFixed(2) + '</td><td>' + r.scoresAway.toFixed(2) + '</td>'
      + '<td>' + r.concedes.toFixed(2) + '</td><td>' + r.goals.toFixed(2) + '</td></tr>').join('')
    + '</tbody></table>';

  document.querySelectorAll('#teamsView th').forEach((th) => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      teamSort = key === teamSort.key
        ? { key, dir: teamSort.dir * -1 }
        : { key, dir: key === 'name' || key === 'div' ? 1 : -1 };
      renderTeams();
    });
  });
}

// ---------------------------------------------------------------------------
// Backtest — walk-forward validation
//
// The only honest way to grade a probability model is to make it predict
// matches it has never seen. For each week in the test period, ratings are
// refitted using strictly earlier matches, then used to price that week's
// fixtures. Nothing from the future leaks into the fit.
//
// A probability isn't right or wrong. A model that says 60% should see both
// teams score in about 60 of every 100 such matches — landing 80 makes it
// badly calibrated, not clever. So the model is graded three ways:
//   - calibration: predicted rate against actual rate, by band
//   - Brier score: mean squared error, lower is better
//   - log loss: punishes confident mistakes harder
// all measured against a baseline that always predicts the running base rate.
// ---------------------------------------------------------------------------

const WARMUP_MATCHES = 60;  // per division, before it may predict anything
const STEP_DAYS = 7;

let backtestResult = null;
let backtestRunning = false;

function addDays(iso, n) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

function brier(rows, key) {
  let s = 0;
  for (const r of rows) s += Math.pow(r[key] - r.actual, 2);
  return s / rows.length;
}

function logLoss(rows, key) {
  let s = 0;
  for (const r of rows) {
    const p = Math.min(0.999, Math.max(0.001, r[key]));
    s += r.actual ? -Math.log(p) : -Math.log(1 - p);
  }
  return s / rows.length;
}

function runBacktest() {
  const halfLife = Number(prefs.decay) || 0;
  const all = data.matches
    .filter((m) => prefs.divisions.includes(m.div))
    .slice()
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

  if (all.length < 200) return null;

  const rows = [];
  const firstDate = all[0].date;
  const lastDate = all[all.length - 1].date;

  // Running base rate, using only matches already seen.
  let seenTotal = 0, seenBtts = 0;

  let cursor = addDays(firstDate, 30);

  while (cursor <= lastDate) {
    const next = addDays(cursor, STEP_DAYS);
    const history = all.filter((m) => m.date < cursor);
    const week = all.filter((m) => m.date >= cursor && m.date < next);

    if (week.length && history.length) {
      const baseRate = seenTotal > 20 ? seenBtts / seenTotal : 0.5;
      const fits = {};

      for (const div of DIV_ORDER) {
        if (!prefs.divisions.includes(div)) continue;
        const hist = history.filter((m) => m.div === div);
        fits[div] = hist.length >= WARMUP_MATCHES ? fitDivision(hist, halfLife) : null;
      }

      for (const m of week) {
        const fit = fits[m.div];
        if (!fit) continue;

        const h = fit.teams.get(m.home);
        const a = fit.teams.get(m.away);
        // Only grade fixtures where both sides were actually rated. Scoring
        // the model on teams it had never seen would flatter the baseline.
        if (!h || !a) continue;

        const lh = fit.mu * h.attack * a.defence * fit.homeEdge;
        const la = fit.mu * a.attack * h.defence;
        const actual = m.hg > 0 && m.ag > 0 ? 1 : 0;

        const row = {
          date: m.date,
          div: m.div,
          model: pBtts(lh, la),
          base: baseRate,
          actual,
          modelOver: pOver(lh, la, 2),
          overActual: m.hg + m.ag > 2 ? 1 : 0,
          market: null,
        };

        if (m.o25 && m.u25) {
          const o = 1 / m.o25, u = 1 / m.u25;
          if (o + u > 0) row.market = o / (o + u);
        }

        rows.push(row);
      }
    }

    for (const m of week) {
      seenTotal++;
      if (m.hg > 0 && m.ag > 0) seenBtts++;
    }

    cursor = next;
  }

  if (rows.length < 50) return null;

  // Calibration bands, five points wide across the range the model uses.
  const bands = [];
  for (let lo = 0.30; lo < 0.85; lo += 0.05) {
    const inBand = rows.filter((r) => r.model >= lo && r.model < lo + 0.05);
    if (inBand.length) {
      bands.push({
        lo,
        hi: lo + 0.05,
        n: inBand.length,
        predicted: inBand.reduce((s, r) => s + r.model, 0) / inBand.length,
        actual: inBand.reduce((s, r) => s + r.actual, 0) / inBand.length,
      });
    }
  }

  const withMarket = rows.filter((r) => r.market !== null);

  return {
    n: rows.length,
    from: rows[0].date,
    to: rows[rows.length - 1].date,
    baseRate: rows.reduce((s, r) => s + r.actual, 0) / rows.length,
    bands,
    btts: {
      modelBrier: brier(rows, 'model'),
      baseBrier: brier(rows, 'base'),
      modelLoss: logLoss(rows, 'model'),
      baseLoss: logLoss(rows, 'base'),
    },
    over: withMarket.length > 50 ? {
      n: withMarket.length,
      modelBrier: brier(withMarket.map((r) => ({ p: r.modelOver, actual: r.overActual })), 'p'),
      marketBrier: brier(withMarket.map((r) => ({ p: r.market, actual: r.overActual })), 'p'),
    } : null,
  };
}

function renderResults() {
  const view = document.getElementById('resultsView');

  if (backtestRunning) {
    view.innerHTML = '<div class="empty">Replaying every past week…</div>';
    return;
  }

  if (!backtestResult) {
    view.innerHTML = '<div class="board" style="padding:22px 16px">'
      + '<p style="margin:0 0 14px;color:var(--ink-soft);font-size:14px;max-width:62ch">'
      + 'Replays the loaded seasons a week at a time, refitting the ratings from '
      + 'earlier matches only, and grades every prediction against what actually happened.</p>'
      + '<button class="btn" id="runBacktest">Run backtest</button></div>';
    document.getElementById('runBacktest').addEventListener('click', () => {
      backtestRunning = true;
      renderResults();
      setTimeout(() => {
        backtestResult = runBacktest();
        backtestRunning = false;
        renderResults();
      }, 20);
    });
    return;
  }

  const r = backtestResult;

  if (!r) {
    view.innerHTML = '<div class="empty">Not enough history to backtest. Widen the match window.</div>';
    return;
  }

  const skill = 1 - r.btts.modelBrier / r.btts.baseBrier;
  const verdict = skill > 0.01
    ? 'The model beats the base rate.'
    : skill < -0.01
      ? 'The model is worse than always predicting the base rate.'
      : 'The model is no better than the base rate.';

  const maxN = Math.max.apply(null, r.bands.map((b) => b.n));

  let html = '<div class="strip">'
    + stat(r.n.toLocaleString('en-GB'), 'matches graded')
    + stat(pct(r.baseRate), 'both scored, actual')
    + stat(r.btts.modelBrier.toFixed(4), 'Brier, model')
    + stat(r.btts.baseBrier.toFixed(4), 'Brier, base rate')
    + stat((skill >= 0 ? '+' : '') + (skill * 100).toFixed(1) + '%', 'skill over base rate')
    + '</div>';

  html += '<div class="board"><div class="boardhead"><span>Calibration — '
    + escapeHtml(shortDate(r.from)) + ' to ' + escapeHtml(shortDate(r.to))
    + '</span><span>predicted vs actual</span></div>';

  for (const b of r.bands) {
    const gap = b.actual - b.predicted;
    const colour = Math.abs(gap) < 0.04 ? 'var(--balanced)' : 'var(--lopsided)';
    html += '<article class="fixture" style="grid-template-columns:78px minmax(0,1fr) 190px">'
      + '<div class="pcell"><b>' + Math.round(b.lo * 100) + '</b><span>to ' + Math.round(b.hi * 100) + '%</span></div>'
      + '<div><div class="bars">'
      + '<div class="side l"><span class="b" style="width:' + (b.predicted * 100).toFixed(1) + '%;background:var(--dim)"></span></div>'
      + '<span class="axis"></span>'
      + '<div class="side r"><span class="b" style="width:' + (b.actual * 100).toFixed(1) + '%;background:' + colour + '"></span></div>'
      + '</div><div class="lambdas"><span>said ' + pct(b.predicted) + '</span><span>happened ' + pct(b.actual) + '</span></div></div>'
      + '<div class="barcell"><div class="meta">' + b.n + ' matches · '
      + (gap >= 0 ? '+' : '') + (gap * 100).toFixed(1) + 'pt</div></div></article>';
  }

  html += '</div>';

  html += '<div class="board" style="margin-top:14px"><div class="boardhead"><span>Verdict</span></div>'
    + '<p style="margin:6px 0 10px;color:var(--ink-soft);font-size:14px">' + verdict
    + ' Brier ' + r.btts.modelBrier.toFixed(4) + ' against ' + r.btts.baseBrier.toFixed(4)
    + ', log loss ' + r.btts.modelLoss.toFixed(4) + ' against ' + r.btts.baseLoss.toFixed(4) + '.</p>';

  if (r.over) {
    const beat = r.over.modelBrier < r.over.marketBrier;
    html += '<p style="margin:0 0 8px;color:var(--ink-soft);font-size:14px">On over 2.5, where real closing prices exist, the model scores '
      + r.over.modelBrier.toFixed(4) + ' against the market\u2019s ' + r.over.marketBrier.toFixed(4)
      + ' across ' + r.over.n.toLocaleString('en-GB') + ' matches. '
      + (beat
        ? 'It edges the market, which is unusual enough to be worth double-checking before trusting.'
        : 'The market is sharper, which is the normal result and not a reason to bin the model.')
      + '</p>';
  }

  html += '<button class="btn" id="rerunBacktest">Run again</button></div>';

  view.innerHTML = html;
  document.getElementById('rerunBacktest').addEventListener('click', () => {
    backtestResult = null;
    renderResults();
  });
}


// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------

function buildDivControl() {
  const el = document.getElementById('divControl');
  el.innerHTML = DIV_ORDER.map((d) => '<button type="button" data-div="' + d + '">' + DIV_SHORT[d] + '</button>').join('');
  el.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const div = btn.dataset.div;
    const i = prefs.divisions.indexOf(div);
    if (i >= 0) { if (prefs.divisions.length > 1) prefs.divisions.splice(i, 1); }
    else prefs.divisions.push(div);
    backtestResult = null;
    savePrefs();
    render();
  });
}

function bindSegment(id, key) {
  document.getElementById(id).addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    prefs[key] = btn.dataset[key];
    // A backtest belongs to the settings it ran under, so anything that
    // changes the fit or the sample invalidates it.
    if (key !== 'sort' && key !== 'view') backtestResult = null;
    savePrefs();
    render();
  });
}

function syncControls() {
  document.querySelectorAll('#divControl button').forEach((b) => {
    b.setAttribute('aria-pressed', prefs.divisions.includes(b.dataset.div));
  });
  [['windowControl', 'window'], ['decayControl', 'decay'], ['sortControl', 'sort'], ['viewControl', 'view']]
    .forEach((pair) => {
      document.querySelectorAll('#' + pair[0] + ' button').forEach((b) => {
        b.setAttribute('aria-pressed', b.dataset[pair[1]] === prefs[pair[1]]);
      });
    });
}

// ---------------------------------------------------------------------------
// Formatting
// ---------------------------------------------------------------------------

function pct(v) { return v == null ? '—' : Math.round(v * 100) + '%'; }

function longDate(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}
function shortDate(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

buildDivControl();
bindSegment('windowControl', 'window');
bindSegment('decayControl', 'decay');
bindSegment('sortControl', 'sort');
bindSegment('viewControl', 'view');

document.getElementById('refreshBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  document.getElementById('messages').innerHTML = '';
  await load({ force: true });
  btn.disabled = false;
});

syncControls();
load();
</script>
