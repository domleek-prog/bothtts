<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Both teams to score — model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ground: #edf0ef;
  --surface: #ffffff;
  --surface-sunk: #f5f7f6;
  --ink: #14201d;
  --ink-soft: #475651;
  --muted: #77857f;
  --line: #d5dcd9;
  --line-strong: #b9c3bf;
  --flag: #8a6d1f;
  --focus: #2f6b4f;
  --r: 6px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

body { padding: 0 20px 80px; }
.wrap { max-width: 1140px; margin: 0 auto; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.masthead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  padding: 28px 0 16px;
  border-bottom: 1px solid var(--line-strong);
}

.masthead h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
.masthead p { margin: 2px 0 0; color: var(--muted); font-size: 13px; max-width: 54ch; }

.status { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }

button { font: inherit; color: inherit; cursor: pointer; }

.btn {
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 500;
}
.btn:hover { border-color: var(--ink-soft); }
.btn[disabled] { opacity: 0.5; cursor: default; }

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}

.control { display: flex; flex-direction: column; gap: 6px; }
.control > span { font-size: 12px; color: var(--muted); font-weight: 500; }

.segmented {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  overflow: hidden;
}

.segmented button {
  background: none;
  border: 0;
  border-right: 1px solid var(--line);
  padding: 5px 11px;
  font-size: 13px;
  color: var(--ink-soft);
  white-space: nowrap;
}
.segmented button:last-child { border-right: 0; }
.segmented button:hover { background: var(--surface-sunk); }
.segmented button[aria-pressed="true"] { background: var(--ink); color: #fff; }

.strip { display: flex; flex-wrap: wrap; gap: 28px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.stat > b { display: block; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat > span { font-size: 12px; color: var(--muted); }

.daygroup { margin-top: 26px; }
.daygroup > h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }

.fixture {
  display: grid;
  grid-template-columns: 78px minmax(0, 1fr) 310px;
  align-items: center;
  gap: 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 16px;
  margin-bottom: 6px;
}

.prob {
  font-size: 27px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  line-height: 1.05;
  padding-left: 11px;
  border-left: 4px solid var(--line-strong);
}
.prob small { display: block; font-size: 11px; font-weight: 400; letter-spacing: 0; color: var(--muted); }

.teams { display: flex; align-items: center; gap: 10px; min-width: 0; }
.team { min-width: 0; }
.team > b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team > span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.team.away { text-align: right; }
.vee { font-size: 12px; color: var(--line-strong); flex: 0 0 auto; }
.teams .home { flex: 1 1 50%; }
.teams .away { flex: 1 1 50%; }

.detail { display: flex; gap: 14px; justify-content: flex-end; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.detail div { text-align: right; }
.detail b { display: block; font-weight: 600; font-size: 14px; }
.detail span { color: var(--muted); font-size: 11px; }

.flag {
  display: inline-block;
  margin-left: 6px;
  font-size: 11px;
  color: var(--flag);
  border: 1px solid currentColor;
  border-radius: 3px;
  padding: 0 4px;
  vertical-align: 1px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  font-variant-numeric: tabular-nums;
  margin-top: 20px;
}

th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); font-size: 13px; }
th { position: sticky; top: 0; background: var(--surface-sunk); font-weight: 600; font-size: 12px; color: var(--ink-soft); cursor: pointer; }
th:first-child, td:first-child { text-align: left; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--surface-sunk); }

.note {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--flag);
  border-radius: var(--r);
  padding: 14px 16px;
  margin-top: 20px;
  font-size: 14px;
}
.note h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
.note p { margin: 0 0 8px; color: var(--ink-soft); }
.note p:last-child { margin-bottom: 0; }
.note code { font-size: 12px; background: var(--surface-sunk); padding: 1px 4px; border-radius: 3px; }

.empty { padding: 46px 0; text-align: center; color: var(--muted); }
.hidden { display: none !important; }

@media (max-width: 860px) {
  .fixture { grid-template-columns: 68px minmax(0, 1fr); row-gap: 10px; }
  .detail { grid-column: 1 / -1; justify-content: flex-start; flex-wrap: wrap; }
  .prob { font-size: 23px; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div>
      <h1>Both teams to score</h1>
      <p>Poisson attack and defence ratings across the Premier League, Championship, League One and League Two.</p>
    </div>
    <div class="status">
      <span id="dataStatus">Loading…</span>
      <button class="btn" id="refreshBtn">Refresh data</button>
    </div>
  </header>

  <section class="controls">
    <label class="control">
      <span>Divisions</span>
      <div class="segmented" id="divControl"></div>
    </label>

    <label class="control">
      <span>Matches used</span>
      <div class="segmented" id="windowControl">
        <button type="button" data-window="season">This season</button>
        <button type="button" data-window="180">6 months</button>
        <button type="button" data-window="365">12 months</button>
        <button type="button" data-window="all">All loaded</button>
      </div>
    </label>

    <label class="control">
      <span>Recency weighting</span>
      <div class="segmented" id="decayControl">
        <button type="button" data-decay="0">Off</button>
        <button type="button" data-decay="60">Fast</button>
        <button type="button" data-decay="150">Medium</button>
        <button type="button" data-decay="365">Slow</button>
      </div>
    </label>

    <label class="control">
      <span>Sort by</span>
      <div class="segmented" id="sortControl">
        <button type="button" data-sort="model">Model</button>
        <button type="button" data-sort="product">Scoring rate</button>
        <button type="button" data-sort="blend">Past BTTS</button>
        <button type="button" data-sort="date">Kick-off</button>
      </div>
    </label>

    <label class="control">
      <span>View</span>
      <div class="segmented" id="viewControl">
        <button type="button" data-view="fixtures">Fixtures</button>
        <button type="button" data-view="teams">Ratings</button>
      </div>
    </label>
  </section>

  <section class="strip" id="strip"></section>

  <div id="messages"></div>
  <div id="fixturesView"></div>
  <div id="teamsView" class="hidden"></div>

</div>

<script>
'use strict';

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

const DIV_ORDER = ['E0', 'E1', 'E2', 'E3'];
const DIV_SHORT = { E0: 'Premier', E1: 'Champ', E2: 'League One', E3: 'League Two' };
const CACHE_KEY = 'btts.data.v1';
const PREFS_KEY = 'btts.prefs.v2';

let data = null;
let teamIndex = null;
let ratingsCache = { key: null, value: null };

const prefs = Object.assign({
  divisions: ['E0', 'E1', 'E2', 'E3'],
  window: 'all',
  decay: '150',
  sort: 'model',
  view: 'fixtures',
  minMatches: 6,
}, loadPrefs());

function loadPrefs() {
  try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch { return {}; }
}
function savePrefs() {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {}
}

// ---------------------------------------------------------------------------
// Loading
// ---------------------------------------------------------------------------

const CACHE_MAX_AGE = 3 * 60 * 60 * 1000; // serve from cache for three hours

async function load({ force = false } = {}) {
  const cached = readCache();

  // Show what we have straight away so the page isn't blank, but go and
  // refetch anyway once the copy is older than a few hours.
  if (cached && !force) {
    adopt(cached, true);
    if (cacheAge(cached) < CACHE_MAX_AGE) return;
  }

  setStatus(cached ? 'Checking for new fixtures…' : 'Fetching results…');

  try {
    const res = await fetch('/.netlify/functions/data');

    if (!res.ok) {
      let detail = '';
      try {
        const body = await res.json();
        if (body.errors && body.errors.length) {
          detail = ' ' + body.errors.slice(0, 3)
            .map((e) => `${e.url.split('/').slice(-2).join('/')} — ${e.message}`)
            .join('; ');
        }
      } catch {}
      throw new Error(`Server returned ${res.status}.${detail}`);
    }

    const payload = await res.json();

    if (!payload.matches || !payload.matches.length) {
      const detail = (payload.errors || []).slice(0, 3)
        .map((e) => `${e.url.split('/').slice(-2).join('/')} — ${e.message}`)
        .join('; ');
      throw new Error(detail || 'The function ran but returned no matches.');
    }

    writeCache(payload);
    adopt(payload, false);
  } catch (err) {
    // A background refresh that fails should leave the visible data alone.
    if (cached) {
      if (force) adopt(cached, true);
      showFetchNote(err.message, true);
    } else {
      setStatus('No data');
      showFetchNote(err.message, false);
    }
  }
}

function cacheAge(payload) {
  const t = new Date(payload.fetchedAt).getTime();
  return Number.isFinite(t) ? Date.now() - t : Infinity;
}

function readCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function writeCache(payload) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(payload)); } catch {}
}

function adopt(payload, fromCache) {
  data = payload;
  ratingsCache = { key: null, value: null };
  buildTeamIndex();
  const when = new Date(payload.fetchedAt);
  const label = when.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  setStatus(`${payload.matches.length} matches · ${fromCache ? 'cached ' : ''}${label}`);
  render();
}

function setStatus(text) { document.getElementById('dataStatus').textContent = text; }

function showFetchNote(message, haveCache) {
  const el = document.createElement('div');
  el.className = 'note';
  el.innerHTML = haveCache
    ? `<h3>Showing the last saved copy</h3><p>The live fetch failed: ${escapeHtml(message)}.</p>`
    : `<h3>Couldn't reach the data function</h3>
       <p>The fetch failed: ${escapeHtml(message)}.</p>
       <p>If you're opening this file directly, the function isn't running. Start it with <code>netlify dev</code>, or deploy the site.</p>`;
  document.getElementById('messages').appendChild(el);
}

// ---------------------------------------------------------------------------
// Team index
// ---------------------------------------------------------------------------

function buildTeamIndex() {
  teamIndex = new Map();

  const touch = (name) => {
    if (!teamIndex.has(name)) teamIndex.set(name, { name, matches: [], divisions: new Set() });
    return teamIndex.get(name);
  };

  for (const m of data.matches) {
    const home = touch(m.home);
    const away = touch(m.away);
    home.divisions.add(m.div);
    away.divisions.add(m.div);
    home.matches.push({ date: m.date, div: m.div, venue: 'H', opponent: m.away, gf: m.hg, ga: m.ag });
    away.matches.push({ date: m.date, div: m.div, venue: 'A', opponent: m.home, gf: m.ag, ga: m.hg });
  }

  for (const team of teamIndex.values()) {
    team.matches.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    team.div = team.matches.length ? team.matches[0].div : null;
    team.moved = team.divisions.size > 1;
  }
}

// ---------------------------------------------------------------------------
// Match window
// ---------------------------------------------------------------------------

function windowCutoff() {
  if (prefs.window === 'all') return null;

  if (prefs.window === 'season') {
    const label = data.seasons && data.seasons[0];
    const year = label ? Number(String(label).slice(0, 4)) : null;
    return Number.isFinite(year) ? `${year}-07-01` : null;
  }

  const days = Number(prefs.window);
  const d = new Date();
  d.setDate(d.getDate() - days);
  return d.toISOString().slice(0, 10);
}

function matchesInWindow() {
  const cutoff = windowCutoff();
  return cutoff ? data.matches.filter((m) => m.date >= cutoff) : data.matches;
}

// ---------------------------------------------------------------------------
// Ratings — Poisson attack/defence by iterative proportional fitting
//
// Model: goals are Poisson with
//   home = mu * attack(home) * defence(away) * homeEdge
//   away = mu * attack(away) * defence(home)
//
// Attack above 1 means a side scores more than the division average;
// defence above 1 means it lets in more. Both are normalised so the
// division averages 1, which keeps mu readable as goals per team per game.
//
// Divisions are fitted separately. This dataset holds no matches between
// divisions, so a Premier League attack rating and a League Two one are not
// on a common scale and cannot be made so from results alone.
// ---------------------------------------------------------------------------

const HOME_EDGE_INIT = 1.3;
const ITERATIONS = 60;
const SHRINK_K = 4; // pseudo-matches pulling a thin sample toward average

function decayWeight(dateStr, halfLifeDays, today) {
  if (!halfLifeDays) return 1;
  const age = (today - new Date(dateStr + 'T12:00:00')) / 86400000;
  return Math.pow(0.5, Math.max(0, age) / halfLifeDays);
}

function fitDivision(matches, halfLife) {
  const today = new Date();
  const rows = matches.map((m) => ({
    home: m.home, away: m.away, hg: m.hg, ag: m.ag,
    w: decayWeight(m.date, halfLife, today),
  }));

  let wSum = 0, goalSum = 0;
  for (const m of rows) { wSum += m.w; goalSum += m.w * (m.hg + m.ag); }
  if (!wSum) return null;

  const mu = goalSum / (2 * wSum); // average goals per team per game

  const names = new Set();
  for (const m of rows) { names.add(m.home); names.add(m.away); }

  const attack = new Map(), defence = new Map(), weight = new Map(), played = new Map();
  for (const n of names) { attack.set(n, 1); defence.set(n, 1); weight.set(n, 0); played.set(n, 0); }
  for (const m of rows) {
    weight.set(m.home, weight.get(m.home) + m.w);
    weight.set(m.away, weight.get(m.away) + m.w);
    played.set(m.home, played.get(m.home) + 1);
    played.set(m.away, played.get(m.away) + 1);
  }

  let homeEdge = HOME_EDGE_INIT;

  for (let it = 0; it < ITERATIONS; it++) {
    const aNum = new Map(), aDen = new Map(), bNum = new Map(), bDen = new Map();
    for (const n of names) { aNum.set(n, 0); aDen.set(n, 0); bNum.set(n, 0); bDen.set(n, 0); }

    for (const m of rows) {
      const h = m.home, a = m.away, w = m.w;

      // Attack: goals scored against the opponent's defence.
      aNum.set(h, aNum.get(h) + w * m.hg);
      aDen.set(h, aDen.get(h) + w * mu * defence.get(a) * homeEdge);
      aNum.set(a, aNum.get(a) + w * m.ag);
      aDen.set(a, aDen.get(a) + w * mu * defence.get(h));

      // Defence: goals let in against the opponent's attack.
      bNum.set(h, bNum.get(h) + w * m.ag);
      bDen.set(h, bDen.get(h) + w * mu * attack.get(a));
      bNum.set(a, bNum.get(a) + w * m.hg);
      bDen.set(a, bDen.get(a) + w * mu * attack.get(h) * homeEdge);
    }

    for (const n of names) {
      if (aDen.get(n) > 0) attack.set(n, aNum.get(n) / aDen.get(n));
      if (bDen.get(n) > 0) defence.set(n, bNum.get(n) / bDen.get(n));
    }

    // Attack and defence are identified only up to a scale factor, so pin the
    // attack mean at 1 and push the slack into defence.
    let mean = 0;
    for (const n of names) mean += attack.get(n);
    mean /= names.size;
    if (mean > 0) {
      for (const n of names) {
        attack.set(n, attack.get(n) / mean);
        defence.set(n, defence.get(n) * mean);
      }
    }

    let hNum = 0, hDen = 0;
    for (const m of rows) {
      hNum += m.w * m.hg;
      hDen += m.w * mu * attack.get(m.home) * defence.get(m.away);
    }
    if (hDen > 0) homeEdge = hNum / hDen;
  }

  // Pull thin samples toward the division average. A side two games into a
  // season shouldn't carry a rating as confident as one forty games in.
  const teams = new Map();
  for (const n of names) {
    const w = weight.get(n);
    const f = w / (w + SHRINK_K);
    teams.set(n, {
      attack: Math.exp(Math.log(attack.get(n)) * f),
      defence: Math.exp(Math.log(defence.get(n)) * f),
      weight: w,
      played: played.get(n),
    });
  }

  return { mu, homeEdge, teams };
}

function ratings() {
  const key = `${prefs.window}|${prefs.decay}`;
  if (ratingsCache.key === key) return ratingsCache.value;

  const halfLife = Number(prefs.decay) || 0;
  const pool = matchesInWindow();
  const byDiv = {};

  for (const div of DIV_ORDER) {
    const ms = pool.filter((m) => m.div === div);
    byDiv[div] = ms.length ? fitDivision(ms, halfLife) : null;
  }

  ratingsCache = { key, value: byDiv };
  return byDiv;
}

// ---------------------------------------------------------------------------
// Probabilities
// ---------------------------------------------------------------------------

// Independent Poissons: both sides score when neither is kept out.
function pBtts(lh, la) {
  return (1 - Math.exp(-lh)) * (1 - Math.exp(-la));
}

// The sum of two independent Poissons is Poisson, so totals need no matrix.
function pOver(lh, la, line) {
  const L = lh + la;
  let cdf = 0, term = Math.exp(-L);
  for (let k = 0; k <= line; k++) {
    cdf += term;
    term *= L / (k + 1);
  }
  return 1 - cdf;
}

// Strip the bookmaker's margin by normalising the two implied probabilities.
function marketOver25(fx) {
  if (!fx.over25 || !fx.under25) return null;
  const o = 1 / fx.over25, u = 1 / fx.under25;
  const total = o + u;
  return total > 0 ? o / total : null;
}

// ---------------------------------------------------------------------------
// Naive baselines, kept as the benchmark the model has to beat
// ---------------------------------------------------------------------------

function venueRates(team, venue) {
  const cutoff = windowCutoff();
  let pool = team.matches.filter((m) => m.venue === venue);
  if (cutoff) pool = pool.filter((m) => m.date >= cutoff);

  const n = pool.length;
  if (!n) return { n: 0, scored: null, conceded: null, btts: null };

  let scored = 0, conceded = 0, btts = 0;
  for (const m of pool) {
    if (m.gf > 0) scored++;
    if (m.ga > 0) conceded++;
    if (m.gf > 0 && m.ga > 0) btts++;
  }
  return { n, scored: scored / n, conceded: conceded / n, btts: btts / n };
}

// ---------------------------------------------------------------------------
// Fixture scoring
// ---------------------------------------------------------------------------

function scoreFixture(fx) {
  const home = teamIndex.get(fx.home);
  const away = teamIndex.get(fx.away);
  if (!home || !away) {
    return { fx, unmatched: [!home && fx.home, !away && fx.away].filter(Boolean) };
  }

  const homeForm = venueRates(home, 'H');
  const awayForm = venueRates(away, 'A');

  const product = homeForm.scored !== null && awayForm.scored !== null
    ? homeForm.scored * awayForm.scored : null;
  const blend = homeForm.btts !== null && awayForm.btts !== null
    ? (homeForm.btts + awayForm.btts) / 2 : null;

  const fit = ratings()[fx.div];
  let model = null, lh = null, la = null, modelOver = null, rated = false;

  if (fit) {
    const h = fit.teams.get(fx.home);
    const a = fit.teams.get(fx.away);
    // A side with no matches in this division sits at the average until it
    // has played some — better than refusing to price the fixture at all.
    const ha = h ? h.attack : 1, hd = h ? h.defence : 1;
    const aa = a ? a.attack : 1, ad = a ? a.defence : 1;
    rated = Boolean(h && a);

    lh = fit.mu * ha * ad * fit.homeEdge;
    la = fit.mu * aa * hd;
    model = pBtts(lh, la);
    modelOver = pOver(lh, la, 2);
  }

  const market = marketOver25(fx);
  const thin = homeForm.n < prefs.minMatches || awayForm.n < prefs.minMatches;

  return {
    fx, home, away, homeForm, awayForm,
    product, blend, model, lh, la, modelOver, market, rated, thin,
    calib: model !== null && market !== null ? modelOver - market : null,
  };
}

function upcomingFixtures() {
  const today = new Date().toISOString().slice(0, 10);
  return data.fixtures
    .filter((f) => prefs.divisions.includes(f.div))
    .filter((f) => f.date >= today);
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function render() {
  syncControls();
  if (!data) return;

  const rows = upcomingFixtures().map(scoreFixture);
  renderStrip(rows);

  if (prefs.view === 'fixtures') {
    document.getElementById('fixturesView').classList.remove('hidden');
    document.getElementById('teamsView').classList.add('hidden');
    renderFixtures(rows);
  } else {
    document.getElementById('fixturesView').classList.add('hidden');
    document.getElementById('teamsView').classList.remove('hidden');
    renderTeams();
  }
}

function renderStrip(rows) {
  const fits = ratings();

  const priced = rows.filter((r) => r.model !== null && r.model !== undefined);
  const avgModel = priced.length ? priced.reduce((a, r) => a + r.model, 0) / priced.length : null;

  const calibs = rows.map((r) => r.calib).filter((c) => c !== null && c !== undefined);
  const bias = calibs.length ? calibs.reduce((a, c) => a + c, 0) / calibs.length : null;

  const edges = DIV_ORDER
    .filter((d) => prefs.divisions.includes(d) && fits[d])
    .map((d) => fits[d].homeEdge);
  const avgEdge = edges.length ? edges.reduce((a, e) => a + e, 0) / edges.length : null;

  const rated = DIV_ORDER
    .filter((d) => prefs.divisions.includes(d) && fits[d])
    .reduce((a, d) => a + fits[d].teams.size, 0);

  document.getElementById('strip').innerHTML = `
    <div class="stat"><b>${rows.length}</b><span>fixtures ahead</span></div>
    <div class="stat"><b>${avgModel === null ? '—' : pct(avgModel)}</b><span>average model chance</span></div>
    <div class="stat"><b>${avgEdge === null ? '—' : '×' + avgEdge.toFixed(2)}</b><span>home scoring edge</span></div>
    <div class="stat"><b>${bias === null ? '—' : (bias >= 0 ? '+' : '') + (bias * 100).toFixed(1) + 'pt'}</b><span>model vs market on over 2.5</span></div>
    <div class="stat"><b>${rated}</b><span>teams rated</span></div>`;
}

function renderFixtures(rows) {
  const view = document.getElementById('fixturesView');

  if (!rows.length) {
    view.innerHTML = `<div class="empty">No upcoming fixtures in the selected divisions. The source file fills up as the weekend approaches.</div>`;
    return;
  }

  const sorted = rows.slice().sort(compareRows);
  let html = '';

  if (prefs.sort === 'date') {
    const byDay = new Map();
    for (const r of sorted) {
      if (!byDay.has(r.fx.date)) byDay.set(r.fx.date, []);
      byDay.get(r.fx.date).push(r);
    }
    for (const [date, group] of byDay) {
      html += `<section class="daygroup"><h2>${escapeHtml(longDate(date))}</h2>${group.map(fixtureRow).join('')}</section>`;
    }
  } else {
    const heading = {
      model: 'Ranked by the model',
      product: 'Ranked by scoring rate',
      blend: 'Ranked by how often both teams have scored',
    }[prefs.sort];
    html = `<section class="daygroup"><h2>${heading}</h2>${sorted.map(fixtureRow).join('')}</section>`;
  }

  view.innerHTML = html;
}

function compareRows(a, b) {
  if (prefs.sort === 'date') {
    if (a.fx.date !== b.fx.date) return a.fx.date < b.fx.date ? -1 : 1;
    return (a.fx.time || '').localeCompare(b.fx.time || '');
  }
  const key = prefs.sort === 'blend' ? 'blend' : prefs.sort === 'product' ? 'product' : 'model';
  const av = a[key] === null || a[key] === undefined ? -1 : a[key];
  const bv = b[key] === null || b[key] === undefined ? -1 : b[key];
  return bv - av;
}

function fixtureRow(r) {
  const fx = r.fx;

  if (r.unmatched) {
    return `<article class="fixture">
      <div class="prob" style="border-left-color: var(--line)">—<small>no data</small></div>
      <div class="teams">
        <div class="team home"><b>${escapeHtml(fx.home)}</b><span>${DIV_SHORT[fx.div] || fx.div}</span></div>
        <div class="vee">v</div>
        <div class="team away"><b>${escapeHtml(fx.away)}</b><span>${shortDate(fx.date)}</span></div>
      </div>
      <div class="detail"><div><b>?</b><span>${escapeHtml(r.unmatched.join(', '))} not in results</span></div></div>
    </article>`;
  }

  const headline = prefs.sort === 'blend' ? r.blend : prefs.sort === 'product' ? r.product : r.model;
  const headlineLabel = prefs.sort === 'blend' ? 'past BTTS'
    : prefs.sort === 'product' ? 'scoring rate' : 'both score';

  return `<article class="fixture">
    <div class="prob" style="border-left-color:${scaleColour(headline)}">
      ${pct(headline)}
      <small>${headlineLabel}</small>
    </div>
    <div class="teams">
      <div class="team home">
        <b>${escapeHtml(fx.home)}${r.home.moved ? '<span class="flag">moved</span>' : ''}</b>
        <span>${ratingLine(fx.div, fx.home)}</span>
      </div>
      <div class="vee">v</div>
      <div class="team away">
        <b>${r.away.moved ? '<span class="flag">moved</span>' : ''}${escapeHtml(fx.away)}</b>
        <span>${ratingLine(fx.div, fx.away)}</span>
      </div>
    </div>
    <div class="detail">
      <div><b>${r.lh === null ? '—' : r.lh.toFixed(2) + ' – ' + r.la.toFixed(2)}</b><span>goals expected</span></div>
      <div><b>${pct(r.blend)}</b><span>past BTTS</span></div>
      <div><b>${r.modelOver === null ? '—' : pct(r.modelOver)}${r.market === null ? '' : ' / ' + pct(r.market)}</b><span>over 2.5 model / market</span></div>
      <div><b>${shortDate(fx.date)}${fx.time ? ' ' + fx.time : ''}</b><span>${DIV_SHORT[fx.div] || fx.div}${r.thin ? ' · thin' : ''}</span></div>
    </div>
  </article>`;
}

function ratingLine(div, name) {
  const fit = ratings()[div];
  const t = fit && fit.teams.get(name);
  if (!t) return 'no matches in this division';
  return `attack ${t.attack.toFixed(2)} · defence ${t.defence.toFixed(2)} · ${t.played} games`;
}

let teamSort = { key: 'goals', dir: -1 };

function renderTeams() {
  const fits = ratings();
  const rows = [];

  for (const div of DIV_ORDER) {
    if (!prefs.divisions.includes(div) || !fits[div]) continue;
    const fit = fits[div];
    for (const [name, t] of fit.teams) {
      const indexed = teamIndex.get(name);
      rows.push({
        name, div,
        played: t.played,
        attack: t.attack,
        defence: t.defence,
        scoresHome: fit.mu * t.attack * fit.homeEdge,
        scoresAway: fit.mu * t.attack,
        concedes: fit.mu * t.defence,
        goals: fit.mu * (t.attack + t.defence),
        moved: indexed ? indexed.moved : false,
      });
    }
  }

  rows.sort((a, b) => {
    const av = a[teamSort.key], bv = b[teamSort.key];
    if (typeof av === 'string') return av.localeCompare(bv) * teamSort.dir * -1;
    return (av - bv) * teamSort.dir;
  });

  const cols = [
    ['name', 'Team'], ['div', 'Division'], ['played', 'Games'],
    ['attack', 'Attack'], ['defence', 'Defence'],
    ['scoresHome', 'Scores at home'], ['scoresAway', 'Scores away'],
    ['concedes', 'Lets in'], ['goals', 'Goals in its games'],
  ];

  document.getElementById('teamsView').innerHTML = `
    <table>
      <thead><tr>${cols.map(([k, l]) => `<th data-key="${k}">${l}</th>`).join('')}</tr></thead>
      <tbody>
        ${rows.map((r) => `<tr>
          <td>${escapeHtml(r.name)}${r.moved ? '<span class="flag">moved</span>' : ''}</td>
          <td>${DIV_SHORT[r.div]}</td>
          <td>${r.played}</td>
          <td>${r.attack.toFixed(2)}</td>
          <td>${r.defence.toFixed(2)}</td>
          <td>${r.scoresHome.toFixed(2)}</td>
          <td>${r.scoresAway.toFixed(2)}</td>
          <td>${r.concedes.toFixed(2)}</td>
          <td>${r.goals.toFixed(2)}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;

  document.querySelectorAll('#teamsView th').forEach((th) => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      teamSort = key === teamSort.key
        ? { key, dir: teamSort.dir * -1 }
        : { key, dir: key === 'name' || key === 'div' ? 1 : -1 };
      renderTeams();
    });
  });
}

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------

function buildDivControl() {
  const el = document.getElementById('divControl');
  el.innerHTML = DIV_ORDER.map((d) => `<button type="button" data-div="${d}">${DIV_SHORT[d]}</button>`).join('');
  el.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const div = btn.dataset.div;
    const i = prefs.divisions.indexOf(div);
    if (i >= 0) { if (prefs.divisions.length > 1) prefs.divisions.splice(i, 1); }
    else prefs.divisions.push(div);
    savePrefs();
    render();
  });
}

function bindSegment(id, key) {
  document.getElementById(id).addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    prefs[key] = btn.dataset[key];
    savePrefs();
    render();
  });
}

function syncControls() {
  document.querySelectorAll('#divControl button').forEach((b) => {
    b.setAttribute('aria-pressed', prefs.divisions.includes(b.dataset.div));
  });
  [['windowControl', 'window'], ['decayControl', 'decay'], ['sortControl', 'sort'], ['viewControl', 'view']]
    .forEach(([id, key]) => {
      document.querySelectorAll(`#${id} button`).forEach((b) => {
        b.setAttribute('aria-pressed', b.dataset[key] === prefs[key]);
      });
    });
}

// ---------------------------------------------------------------------------
// Formatting
// ---------------------------------------------------------------------------

function pct(v) {
  return v === null || v === undefined ? '—' : Math.round(v * 100) + '%';
}

function scaleColour(v) {
  if (v === null || v === undefined) return 'var(--line)';
  const t = Math.max(0, Math.min(1, (v - 0.35) / 0.35));
  const from = [158, 74, 52], to = [47, 107, 79];
  return `rgb(${from.map((c, i) => Math.round(c + (to[i] - c) * t)).join(',')})`;
}

function longDate(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}
function shortDate(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

buildDivControl();
bindSegment('windowControl', 'window');
bindSegment('decayControl', 'decay');
bindSegment('sortControl', 'sort');
bindSegment('viewControl', 'view');

document.getElementById('refreshBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  document.getElementById('messages').innerHTML = '';
  await load({ force: true });
  btn.disabled = false;
});

syncControls();
load();
</script>
</body>
